name: flutter_map_mapbox
description: "Tramo - Mapbox Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  mapbox_maps_flutter: ^2.18.0
  geolocator: ^14.0.2
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.1.0
  go_router: ^17.0.1
  retrofit: ^4.9.2                   
  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  dio_http_formatter: ^3.3.1
  freezed_annotation: ^3.1.0
  json_annotation: 4.9.0
  intl: ^0.20.2
  riverpod_annotation: ^4.0.0
  fpdart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  riverpod_generator: ^4.0.0+1
  retrofit_generator: ^10.2.1 
  json_serializable: ^6.11.2
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
